<div class="secure-image-container">
  <div *ngIf="loading && showPlaceholder" class="image-placeholder loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  
  <div *ngIf="error && showPlaceholder" class="image-placeholder error">
    <ion-icon name="image-outline"></ion-icon>
  </div>

  <img *ngIf="!loading && !error && secureUrl" 
       [src]="secureUrl" 
       [alt]="alt"
       [style.object-fit]="objectFit" />
</div>
