<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="50" height="50" rx="10" fill="#111" stroke="#00FFFF" stroke-width="2" filter="url(#glow)" />
  <rect x="5" y="5" width="50" height="50" rx="10" fill="transparent" stroke="#FF00FF" stroke-width="1" stroke-dasharray="10 5" />
</svg>