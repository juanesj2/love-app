  <circle cx="40" cy="45" r="2.5" fill="#444" />
  <path d="M 30 48 Q 32.5 52 35 48" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="3" fill="#FF6B81" opacity="0.6" />
  <circle cx="45" cy="50" r="3" fill="#FF6B81" opacity="0.6" />
  
  <!-- Paws (Bottom left) -->
